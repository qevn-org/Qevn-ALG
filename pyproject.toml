[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-intelligence"
version = "0.1.0"
description = "LinkedIn Public-Signal Multi-Agent Intelligence Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.70",
    "langchain>=0.3.18",
    "langchain-core>=0.3.35",
    "langchain-openai>=0.3.6",
    "langchain-mcp-adapters>=0.1.0",
    "streamlit>=1.42.0",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.7.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.1",
    "tenacity>=9.0.0",
    "structlog>=25.1.0",
    "pandas>=2.2.3",
    "langchain-groq>=1.1.3",
    "scikit-learn>=1.4.0",
    "openpyxl>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]>=0.1.71",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "ruff>=0.9.9",
    "mypy>=1.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: marks tests that require live external API credentials (deselect with '-m \"not live\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/*" = ["E402"]
"app/**/*" = ["E402"]

[tool.pyright]
include = ["src", "app", "tests"]
extraPaths = [".", "src"]

